plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "stub-translator-java"

// :ir is core-ir's neutral IR module, resolved by github-gradle from core-ir's release assets.
// :annotations, :processor and :contract come from api the same way: :ir exports api's seam types
// in HandlerCtx's public fields and emits its own TypeScript, so any build including :ir must
// resolve api at the same coordinates.

// :stub       - the reference translator, the smallest thing that satisfies the Translator SPI.
// :teavm-stub - TeaVM JS export surface over :stub + :ir.
include ":stub"
include ":teavm-stub"
